services:
  dev:
    build:
      context: .
      target: dev
    ports:
      - '${VITE_PORT:-5173}:5173'
    user: '${UID:-1000}:${GID:-1000}'
    environment:
      CHOKIDAR_USEPOLLING: 'true'
      WATCHPACK_POLLING: 'true'
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://127.0.0.1:5173']
      interval: 10s
      timeout: 3s
      retries: 3
  test:
    build:
      context: .
      target: test
    profiles: [ci]
    user: '${UID:-1000}:${GID:-1000}'
  lint:
    build:
      context: .
      target: lint
    profiles: [ci]
    user: '${UID:-1000}:${GID:-1000}'
  build:
    build:
      context: .
      target: build
    profiles: [ci]
    user: '${UID:-1000}:${GID:-1000}'
    volumes:
      - ./dist:/app/dist
  verify:
    build:
      context: .
      target: test
    profiles: [ci]
    command: npm run verify
  test-watch:
    build:
      context: .
      target: test
    profiles: [watch]
    command: npm run test -- --watch
  app:
    build:
      context: .
      target: prod
    ports:
      - '${PORT:-8080}:80'
    profiles: [prod]
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://127.0.0.1/health']
      interval: 10s
      timeout: 3s
      retries: 3
  e2e:
    image: mcr.microsoft.com/playwright:v1.49.1-noble
    profiles: [e2e]
    depends_on:
      app:
        condition: service_healthy
    working_dir: /work
    volumes:
      - .:/work
    command: sh -lc 'npm ci --ignore-scripts --no-audit --loglevel=error && npx playwright test'
volumes:
  node_modules:
